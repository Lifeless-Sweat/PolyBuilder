name: Generate Track

# Run manually from the "Actions" tab. No Codespace needed.
on:
  workflow_dispatch:
    inputs:
      pieces:
        description: "Track length in pieces (10-150)"
        required: false
        default: "40"
      theme:
        description: "Theme"
        required: false
        default: "Summer"
        type: choice
        options:
          - Summer
          - Winter
          - Desert
      seed:
        description: "Seed (leave empty for a random track)"
        required: false
        default: ""
      start_height:
        description: "Starting elevation (0 = flat ground)"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate the track
        run: |
          ARGS="--pieces ${{ github.event.inputs.pieces }} --env ${{ github.event.inputs.theme }} --start-height ${{ github.event.inputs.start_height }} --out track_code.txt --preview track_preview.txt"
          if [ -n "${{ github.event.inputs.seed }}" ]; then ARGS="$ARGS --seed ${{ github.event.inputs.seed }}"; fi
          node polytrack_generator.js $ARGS

      - name: Show the code on the run page
        run: |
          echo '### Your track code' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat track_code.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### Layout (S = start, C = checkpoint, F = finish)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat track_preview.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Save the track into the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add track_code.txt track_preview.txt
          git diff --staged --quiet || git commit -m "Generate track"
          git push
