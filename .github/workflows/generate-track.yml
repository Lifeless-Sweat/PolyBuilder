name: Generate Track

# Run this manually from the "Actions" tab on GitHub - no Codespace needed.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the track and export a real PolyTrack code
        run: OUTPUT_FILE=track_code.txt node build_oval.js

      - name: Commit the track code back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add track_code.txt
          git diff --staged --quiet || git commit -m "Generate track code"
          git push
